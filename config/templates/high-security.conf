# simple-ldapd high-security configuration
# LDAPS only; StartTLS optional. SASL/GSSAPI will be wired later.

listen_address = 0.0.0.0
ldap_port = 389
ldaps_port = 636
enable_ldaps = true
enable_starttls = true
tls_cert_file = /etc/simple-ldapd/tls/server.crt
tls_key_file = /etc/simple-ldapd/tls/server.key
tls_ca_file = /etc/simple-ldapd/tls/ca.crt
backend = ldif
ldif_file = /var/lib/simple-ldapd/directory.ldif
schema_dir = /etc/simple-ldapd/schemas
base_dn = dc=example,dc=com
root_dn = cn=admin,dc=example,dc=com
# root_password =
require_confidentiality = true
log_file = /var/log/simple-ldapd/simple-ldapd.log
log_level = warning
foreground = false
