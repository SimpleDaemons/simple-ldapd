# simple-ldapd development configuration
# Unprivileged ports so the skeleton can bind without root.

listen_address = 127.0.0.1
ldap_port = 3389
ldaps_port = 6636
enable_ldaps = false
enable_starttls = false
backend = memory
ldif_file = config/examples/simple/example.ldif
schema_dir = schemas
base_dn = dc=example,dc=com
root_dn = cn=admin,dc=example,dc=com
root_password = secret
log_level = debug
foreground = true
