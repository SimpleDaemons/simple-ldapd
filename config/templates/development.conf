# simple-ldapd development configuration
# Unprivileged ports so a lab instance can bind without root.

listen_address = 127.0.0.1
ldap_port = 3389
ldaps_port = 6636
enable_ldaps = false
enable_starttls = false
# tls_cert_file = tls/server.crt
# tls_key_file = tls/server.key
# require_confidentiality = false
backend = memory
ldif_file = config/examples/simple/example.ldif
schema_dir = schemas
base_dn = dc=example,dc=com
root_dn = cn=admin,dc=example,dc=com
root_password = secret
krb_realm = EXAMPLE.COM
gssapi_service = ldap/localhost
gssapi_keytab = config/examples/simple/lab.keytab
log_level = debug
foreground = true
# Default (no acl lines): anonymous search is allowed; only root_dn can write.
# acl = users search dc=example,dc=com
# acl = group:cn=directory-admins,ou=Groups,dc=example,dc=com write dc=example,dc=com
