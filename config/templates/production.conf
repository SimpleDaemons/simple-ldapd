# simple-ldapd production configuration

listen_address = 0.0.0.0
ldap_port = 389
ldaps_port = 636
enable_ldaps = true
enable_starttls = true
tls_cert_file = /etc/simple-ldapd/tls/server.crt
tls_key_file = /etc/simple-ldapd/tls/server.key
tls_ca_file = /etc/simple-ldapd/tls/ca.crt
backend = sqlite
sqlite_file = /var/lib/simple-ldapd/directory.sqlite
# Optional LDIF seed when the SQLite file is empty; writes do not rewrite this file.
# ldif_file = /var/lib/simple-ldapd/directory.ldif
schema_dir = /etc/simple-ldapd/schemas
base_dn = dc=example,dc=com
root_dn = cn=admin,dc=example,dc=com
# Set a strong root bind password before exposing the service.
# root_password =
# krb_realm = EXAMPLE.COM
# gssapi_service = ldap/localhost
# gssapi_keytab = /etc/simple-ldapd/lab.keytab
log_file = /var/log/simple-ldapd/simple-ldapd.log
log_level = info
bind_rate_limit = 60
max_pdu_size = 1048576
max_sessions = 128
idle_timeout = 300
foreground = false
